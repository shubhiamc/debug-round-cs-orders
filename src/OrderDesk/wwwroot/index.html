<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrderDesk</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #1c1c1e; }
    h1 { margin-bottom: 4px; }
    section { border: 1px solid #d8d8dc; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    input, select, button { font: inherit; padding: 6px 8px; margin: 2px 4px 2px 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; }
    #banner { padding: 8px 12px; border-radius: 6px; margin: 8px 0; display: none; }
    #banner.ok { display: block; background: #e6f4ea; }
    #banner.err { display: block; background: #fce8e6; }
    .muted { color: #6b6b70; }
    .Cancelled { color: #a33; }
  </style>
</head>
<body>
  <h1>OrderDesk</h1>
  <div class="muted" id="who">Not signed in</div>
  <div id="banner"></div>

  <section id="auth">
    <h2>Account</h2>
    <input id="username" placeholder="username" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button id="btn-register">Register</button>
    <button id="btn-login">Log in</button>
    <button id="btn-logout">Log out</button>
  </section>

  <section>
    <h2>Products</h2>
    <table>
      <thead><tr><th>#</th><th>Name</th><th>Price</th><th>In stock</th></tr></thead>
      <tbody id="products"></tbody>
    </table>
  </section>

  <section>
    <h2>New order</h2>
    <select id="order-product"></select>
    <input id="order-qty" type="number" min="1" value="1" style="width: 70px">
    <input id="order-coupon" placeholder="coupon code">
    <button id="btn-order">Place order</button>
  </section>

  <section>
    <h2>My orders</h2>
    <label>Status
      <select id="filter">
        <option value="">all</option>
        <option value="pending">pending</option>
        <option value="cancelled">cancelled</option>
      </select>
    </label>
    <button id="btn-refresh">Refresh</button>
    <table>
      <thead><tr><th>#</th><th>Items</th><th>Subtotal</th><th>Discount</th><th>Tax</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody id="orders"></tbody>
    </table>
  </section>

  <section>
    <h2>Look up an order</h2>
    <input id="lookup-id" type="number" placeholder="order #" style="width: 110px">
    <button id="btn-lookup">Look up</button>
    <pre id="lookup-result" class="muted"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
